# Test configuration for tests/test_e2e.py and tests/test_jump.py:
#   python tests\test_e2e.py tests\e2e.example.toml
# Other ports than the real server, so both can run. Copy it and adjust the paths
# (dir = your game folder, key and progress_file inside this repository).
[game]
dir = 'C:/Program Files (x86)/Steam/steamapps/common/Infinite Crisis Steam'
[server]
key = 'keys/server_private.pem'
soap_port = 18888
user_port = 19000
game_port = 19001
[match]
player_class = 0x4000007C
[timing]
objects_min_delay = 1.0
objects_max_wait = 6.0
link_delay = 0.5
cinematic_delay = 0.5
ping_lifetime = 1.0
idle_resend = 1.0
[combat]
basic_attack_damage = 200
attack_interval = 0.2
corpse_seconds = 0.5
[account]
progress_file = 'logs/progress_test.json'
